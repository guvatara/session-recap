name: Release

# Срабатывает при публикации релиза на GitHub (Releases -> Draft a new release)
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Подставить версию и ссылку на скачивание в module.json
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${TAG#v}"
          sed -i 's/"version": ".*"/"version": "'"$VERSION"'"/' module.json
          sed -i 's|"download": ".*"|"download": "https://github.com/${{ github.repository }}/releases/download/'"$TAG"'/module.zip"|' module.json

      - name: Собрать module.zip
        run: zip -r ./module.zip module.json scripts/ styles/

      - name: Прикрепить файлы к релизу
        uses: softprops/action-gh-release@v2
        with:
          files: |
            module.zip
            module.json
